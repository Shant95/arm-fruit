services:
  postgres:
    image: postgres:15-alpine     
    container_name: armfruit-db    
    environment:
      POSTGRES_USER: postgres      
      POSTGRES_PASSWORD: mysecretpassword  
      POSTGRES_DB: armfruit_db      
    ports:
      - "5432:5432"               
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: